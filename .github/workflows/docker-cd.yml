name: CD - Build & Push Docker Image

on:
  push:
    branches:
      - create/docker-cd-pipeline   # your default branch

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.set-image.outputs.image-name }}    

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Set Docker image name
      - name: Set Docker image name 
        id: set-image
        run: echo "::set-output name=image-name::instagram-bio-history:${GITHUB_SHA::7}"

      # Step 4: Build the image 
      - name: Build the Docker image 
        run:  |
         docker build -t ${{ steps.set-image.outputs.image-name }} .
    

      # Step 5: upload the image in the artifact 
      - name: Save image in artifact 
        uses: actions/upload-artifact@v3 
        with:
          name: docker-image
          path: |
           $(docker save -o docker-image.tar ${{ steps.set-image.outputs.image-name }})
  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Download Docker image artifact
        uses: actions/download-artifact@v3
        with:
          name: docker-image
          path: ./docker-image

      - name: Load Docker image
        run: docker load -i ./docker-image/docker-image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          IMAGE_NAME=instagram-bio-history
          SHA_SHORT=${GITHUB_SHA::7}
          docker tag $IMAGE_NAME:$SHA_SHORT ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:$SHA_SHORT
          docker tag $IMAGE_NAME:$SHA_SHORT ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:$SHA_SHORT
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:latest
 
             
  


