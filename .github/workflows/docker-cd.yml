name: CD - Build & Push Docker Image

on:
  push:
    branches:
      - master   # your default branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Extract short commit SHA
      - name: Set short SHA environment variable
        id: vars
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Step 5: Build and push Docker image with two tags
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/instagram-bio-history:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/instagram-bio-history:${{ env.SHA_SHORT }}

      # Step 6: Optional success message
      - name: Success message
        run: echo "Docker image pushed with tags: latest and ${{ env.SHA_SHORT }}"

